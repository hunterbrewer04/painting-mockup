<section id="portfolio" class="av-dark">

        <figcaption class="pf-cap">
          <span class="pf-title">Villa Kühn</span>
          <span class="pf-scope">Full exterior · mineral silicate on render</span>
        </figcaption>
      </figure>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View Sag Harbor Victorian">
        <img src="{{IMG:g-victorian}}" width="900" height="1200" loading="lazy" decoding="async" alt="Black and cream Victorian house with turret">
        <figcaption class="pf-cap">
          <span class="pf-title">Sag Harbor Victorian</span>
          <span class="pf-scope">Exterior · two-tone in charcoal &amp; cream</span>
        </figcaption>
      </figure>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View West Village Brownstone">
        <img src="{{IMG:g-banister}}" width="1100" height="825" loading="lazy" decoding="async" alt="Close view of an oak staircase banister">
        <figcaption class="pf-cap">
          <span class="pf-title">West Village Brownstone</span>
          <span class="pf-scope">Staircase · hand-rubbed oil on oak</span>

      </figure>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View Riverside Drive Landmark">
        <img src="{{IMG:g-neoclassical}}" width="1100" height="825" loading="lazy" decoding="async" alt="White neoclassical stone facade with portico">
        <figcaption class="pf-cap">
          <span class="pf-title">Riverside Drive Landmark</span>
          <span class="pf-scope">Facade restoration · lime render &amp; stone repair</span>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View The Meridian Hotel">
        <img src="{{IMG:g-lobby}}" width="1100" height="825" loading="lazy" decoding="async" alt="Grand hotel lobby with chandeliers and fountain">

      </figure>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View Carved Entry, Kraków House">
        <img src="{{IMG:g-door}}" width="900" height="1200" loading="lazy" decoding="async" alt="Carved oak door with verdigris eagle knocker">
        <figcaption class="pf-cap">
          <span class="pf-title">Carved Entry, Kraków House</span>
          <span class="pf-scope">Conservation · oil finish on carved oak</span>
        </figcaption>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View Printing House Lofts">
        <img src="{{IMG:g-spiral}}" width="1100" height="825" loading="lazy" decoding="async" alt="Spiral staircase seen from above in monochrome">
        <figcaption class="pf-cap">
          <span class="pf-title">Printing House Lofts</span>

      <figure class="av-frame pf-figure" data-reveal data-cursor="View" tabindex="0" role="button" aria-haspopup="dialog" aria-label="View Nantucket Cottage">
        <img src="{{IMG:g-chardoor}}" width="900" height="1199" loading="lazy" decoding="async" alt="Weathered charcoal door with iron scrollwork">
        <figcaption class="pf-cap">
          <span class="pf-title">Nantucket Cottage</span>
          <span class="pf-scope">Door &amp; shingle · weathered charcoal</span>
        </figcaption>

  </div>

  <div class="pf-lightbox" role="dialog" aria-modal="true" aria-label="Selected work, image viewer" hidden>
    <button type="button" class="pf-lb-close" aria-label="Close viewer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18"></line>
        <line x1="18" y1="6" x2="6" y2="18"></line>
      </svg>
    </button>
    <button type="button" class="pf-lb-nav pf-lb-prev" aria-label="Previous work">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 5 8 12 15 19"></polyline>
      </svg>
    </button>
    <figure class="pf-lb-figure">
      <img class="pf-lb-img" src="" alt="">
      <figcaption class="pf-lb-cap">
        <span class="pf-lb-title"></span>
        <span class="pf-lb-scope"></span>
        <span class="pf-lb-index"></span>
      </figcaption>
    </figure>
    <button type="button" class="pf-lb-nav pf-lb-next" aria-label="Next work">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 5 16 12 9 19"></polyline>
      </svg>
    </button>
  </div>

<style>
  #portfolio { padding-block: var(--sect-pad); overflow: hidden; }

  #portfolio .pf-head { margin-bottom: clamp(3rem, 6vw, 5rem); max-width: 44ch; }
  #portfolio .pf-lead-h { font-size: var(--fs-h2); }
  #portfolio .pf-lead {
    color: var(--taupe);
    font-size: var(--fs-body);
    max-width: 46ch;
    margin: 0;
  }

  /* masonry via CSS columns */
  #portfolio .pf-grid {
    column-count: 1;
    column-gap: 1.4rem;
  }
  @media (min-width: 640px)  { #portfolio .pf-grid { column-count: 2; } }
  @media (min-width: 1024px) { #portfolio .pf-grid { column-count: 3; } }

  #portfolio .pf-figure {
    display: block;
    width: 100%;
    margin: 0 0 1.4rem;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    cursor: pointer;
    background: var(--char);
  }
  #portfolio .pf-figure img { height: auto; }

  /* caption sits below the image; opaque ground masks any hover-zoom bleed */
  #portfolio .pf-cap {
    position: relative;
    z-index: 2;
    background: var(--char);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding-top: 0.9rem;
  }
  #portfolio .pf-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.25;
    color: var(--plaster);
  }
  #portfolio .pf-scope {
    font-family: var(--sans);
    font-size: var(--fs-small);
    color: var(--taupe);
    line-height: 1.4;
  }

  #portfolio .pf-figure:focus-visible {
    outline: 2px solid var(--bronze);
    outline-offset: 4px;
  }

  /* ---- lightbox ---- */
  #portfolio .pf-lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(1rem, 4vw, 3rem);
    background: rgba(20, 17, 14, 0.96);
    opacity: 0;
    transition: opacity var(--dur-med) var(--ease-out);
  }
  #portfolio .pf-lightbox[hidden] { display: none; }
  #portfolio .pf-lightbox.pf-open { opacity: 1; }

  #portfolio .pf-lb-figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.15rem;
    max-width: 86vw;
  }
  #portfolio .pf-lb-img {
    max-height: 84vh;
    max-width: 86vw;
    width: auto;
    height: auto;
    object-fit: contain;
    opacity: 0;
    transform: scale(0.97);
  }

  #portfolio .pf-lb-cap {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    max-width: 40ch;
  }
  #portfolio .pf-lb-title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: var(--fs-h3);
    color: var(--plaster);
  }
  #portfolio .pf-lb-scope {
    font-family: var(--sans);
    font-size: var(--fs-small);
    color: var(--taupe);
  }
  #portfolio .pf-lb-index {
    font-family: var(--sans);
    font-size: var(--fs-small);
    letter-spacing: 0.12em;
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  #portfolio .pf-lb-nav {
    position: absolute;
    top: 0;
    bottom: 0;
    width: clamp(3.25rem, 10vw, 7rem);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: none;
    border: 0;
    color: var(--plaster);
    opacity: 0.62;
    cursor: pointer;
    transition: opacity var(--dur-fast) ease;
  }
  #portfolio .pf-lb-nav:hover,
  #portfolio .pf-lb-nav:focus-visible { opacity: 1; }
  #portfolio .pf-lb-prev { left: 0; }
  #portfolio .pf-lb-next { right: 0; }

  #portfolio .pf-lb-close {
    position: absolute;
    top: clamp(0.9rem, 3vw, 2rem);
    right: clamp(0.9rem, 3vw, 2rem);
    width: 3rem;
    height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: none;
    border: 0;
    color: var(--plaster);
    opacity: 0.7;
    cursor: pointer;
    transition: opacity var(--dur-fast) ease;
  }
  #portfolio .pf-lb-close:hover,
  #portfolio .pf-lb-close:focus-visible { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #portfolio .pf-lightbox,
    #portfolio .pf-lb-img { transition: none !important; }
  }
</style>

<script>
  (function () {
    'use strict';
    var root = document.getElementById('portfolio');
    if (!root) return;

    var reduced = (window.AV && window.AV.reduced) || false;
    var figures = Array.prototype.slice.call(root.querySelectorAll('.pf-figure'));
    if (!figures.length) return;

    var data = figures.map(function (fig) {
      var im = fig.querySelector('img');
      return {
        src: im.getAttribute('src'),
        alt: im.getAttribute('alt') || '',
        title: fig.querySelector('.pf-title').textContent,
        scope: fig.querySelector('.pf-scope').textContent
      };
    });
    var n = data.length;

    var overlay  = root.querySelector('.pf-lightbox');
    var img      = overlay.querySelector('.pf-lb-img');
    var elTitle  = overlay.querySelector('.pf-lb-title');
    var elScope  = overlay.querySelector('.pf-lb-scope');
    var elIndex  = overlay.querySelector('.pf-lb-index');
    var btnClose = overlay.querySelector('.pf-lb-close');
    var btnPrev  = overlay.querySelector('.pf-lb-prev');
    var btnNext  = overlay.querySelector('.pf-lb-next');
    var focusables = [btnClose, btnPrev, btnNext];

    var current = 0;
    var opener = null;
    var isOpen = false;
    var prevHtmlOverflow = '';
    var prevBodyOverflow = '';

    function render(i) {
      var d = data[i];
      img.src = d.src;
      img.alt = d.alt;
      elTitle.textContent = d.title;
      elScope.textContent = d.scope;
      elIndex.textContent = (i + 1) + ' / ' + n;
    }

    function animateIn() {
      if (reduced) {
        img.style.transition = 'none';
        img.style.opacity = '1';
        img.style.transform = 'none';
        return;
      }
      img.style.transition = 'none';
      img.style.opacity = '0';
      img.style.transform = 'scale(0.97)';
      /* force reflow so the transition re-triggers */
      void img.offsetWidth;
      img.style.transition = 'opacity var(--dur-slow) var(--ease-out), transform var(--dur-slow) var(--ease-out)';
      img.style.opacity = '1';
      img.style.transform = 'scale(1)';
    }

    function navigate(dir) {
      var ni = (current + dir + n) % n;
      if (reduced) {
        current = ni;
        render(ni);
        return;
      }
      img.style.transition = 'opacity var(--dur-fast) var(--ease-out)';
      img.style.opacity = '0';
      window.setTimeout(function () {
        current = ni;
        render(ni);
        animateIn();
      }, 350);
    }

    function lock() {
      prevHtmlOverflow = document.documentElement.style.overflow;
      prevBodyOverflow = document.body.style.overflow;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
    }
    function unlock() {
      document.documentElement.style.overflow = prevHtmlOverflow;
      document.body.style.overflow = prevBodyOverflow;
    }

    function onKey(e) {
      if (!isOpen) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); navigate(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
      else if (e.key === 'Tab') {
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }

    function open(i, tile) {
      current = i;
      opener = tile;
      render(i);
      overlay.hidden = false;
      lock();
      isOpen = true;
      document.addEventListener('keydown', onKey);
      /* next frame: fade overlay + settle image */
      window.requestAnimationFrame(function () {
        overlay.classList.add('pf-open');
        animateIn();
      });
      btnClose.focus();
    }

    function close() {
      if (!isOpen) return;
      isOpen = false;
      overlay.classList.remove('pf-open');
      document.removeEventListener('keydown', onKey);
      unlock();
      var toFocus = opener;
      if (reduced) {
        overlay.hidden = true;
      } else {
        window.setTimeout(function () { overlay.hidden = true; }, 700);
      }
      if (toFocus && typeof toFocus.focus === 'function') toFocus.focus();
    }

    figures.forEach(function (fig, i) {
      fig.addEventListener('click', function () { open(i, fig); });
      fig.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          open(i, fig);
        }
      });
    });

    btnPrev.addEventListener('click', function () { navigate(-1); });
    btnNext.addEventListener('click', function () { navigate(1); });
    btnClose.addEventListener('click', close);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });
  })();
</script>
